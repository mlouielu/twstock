name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build build artifacts
        # This builds both the .whl (wheel) and .tar.gz (sdist)
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          # This will upload everything in the dist/ folder
          path: dist/*

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
